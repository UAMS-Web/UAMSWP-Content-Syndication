name: CI

# The checks this plugin runs on every pull request and on pushes to master.
#
# The lint and unit chain is the shared one, `UAMS-Web/uams-ci-workflows`, called by the
# `checks` job, so this plugin does not carry a copy that drifts. The call switches on the
# two jobs only a plugin runs (`floor-lint`, `download-archive`), runs on Linux only except
# for Pest, mutates the PHP files a pull request or push changes (the whole plugin on a manual
# or weekly scheduled run) with `composer mutate`, and runs the unit suite as `composer test:unit`.
# `all-platform-jobs: pest` keeps the unit suite on Linux, macOS and Windows (#20); the chain
# classifies Pint, Rector and PHPStan as giving the same result on any platform. `phpcs` stays
# off: this plugin has no PHPCS configuration. The chain's own header lists every input.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow. It `needs:` the
# call, runs `if: always()`, and fails unless the call reports `success`: a `skipped` or
# `cancelled` call fails it. Adding a plain job here means adding it to the `needs:` list of
# `CI`. Do not rename `CI`, and do not rename `checks` without changing `needs:` below.
#
# What the plugin carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts, the Composer
# scripts `test:pint`, `test:refactor`, `stan` and `test:unit`, and `scripts/lint-floor.php`.
# The setup action also installs the isolated `tests/Integration` lock: PHPStan scans the
# WordPress test classes from it, and the unit suite's integration-bootstrap checks need it.

on:
  pull_request:
  push:
    branches: [master]
  # The full mutation pass, weekly: it mutates every first-party file `composer mutate` covers
  # (the chain gives a scheduled run `mutate-full-timeout-minutes`, 180 by default, in place of the
  # 45 minutes a pull request gets), so it catches decay no pull request touched. Monday 07:17 UTC.
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    # Pinned to the v0.9.0 tag (5523d479fa9cdc1c3bfdd581f3f07f730da93451).
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@5523d479fa9cdc1c3bfdd581f3f07f730da93451
    with:
      linux-only: true
      all-platform-jobs: pest
      mutate-ignore-paths: includes
      mutate-paths: includes uamswp-content-syndication.php
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      pest-command: composer test:unit

  # The WordPress integration suite, a plain job beside the call as the chain's header asks:
  # PHPUnit 9.6 from the isolated `tests/Integration` lock, against the matched WordPress 6.8.3
  # fixture and a disposable MariaDB, single-site then multisite.
  integration:
    name: WordPress integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: disposable_root
          MARIADB_DATABASE: syndication_tests
          MARIADB_USER: syndication_tests
          MARIADB_PASSWORD: syndication_disposable
        ports:
          - 127.0.0.1:3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_DB_NAME: syndication_tests
      WP_TESTS_DB_USER: syndication_tests
      WP_TESTS_DB_PASSWORD: syndication_disposable
      WP_TESTS_DB_HOST: 127.0.0.1:3307
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP 8.4.27 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          extensions: mysqli
          coverage: none
          tools: composer:v2
      - name: Validate integration Composer configuration
        run: composer validate --working-dir=tests/Integration --strict --no-check-publish
      - name: Install locked integration dependencies
        run: composer install --working-dir=tests/Integration --no-interaction --no-progress --prefer-dist
      - name: Download clean matched WordPress 6.8.3 fixture
        run: |
          export WP_TESTS_ABSPATH="$RUNNER_TEMP/synd-wordpress"
          echo "WP_TESTS_ABSPATH=$WP_TESTS_ABSPATH" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://wordpress.org/wordpress-6.8.3.tar.gz -o "$RUNNER_TEMP/wordpress.tar.gz"
          mkdir -p "$WP_TESTS_ABSPATH"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" --strip-components=1 -C "$WP_TESTS_ABSPATH"
      - name: Run WordPress single-site tests
        run: tests/Integration/vendor/bin/phpunit -c tests/Integration/phpunit.xml
      - name: Run WordPress multisite tests
        env:
          WP_MULTISITE: '1'
        run: tests/Integration/vendor/bin/phpunit -c tests/Integration/phpunit.xml

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call and
  # every plain job.
  ci:
    name: CI
    needs: [checks, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
