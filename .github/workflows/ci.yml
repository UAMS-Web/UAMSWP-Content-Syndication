name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  synced-files:
    name: Synced files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

  php:
    name: PHP checks (${{ matrix.os }})
    needs: [synced-files]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP 8.4.27 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          coverage: none
          tools: composer:v2
      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish
      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4.27-${{ hashFiles('composer.lock', 'tests/Integration/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install locked integration dependencies for analysis and safety tests
        run: composer install --working-dir=tests/Integration --no-interaction --no-progress --prefer-dist
      - name: Check formatting
        run: composer test:pint
      - name: Check refactoring
        run: composer test:refactor
      - name: Run static analysis
        run: composer stan
      - name: Run unit tests
        run: composer test

  integration:
    name: WordPress integration
    needs: [synced-files]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: disposable_root
          MARIADB_DATABASE: syndication_tests
          MARIADB_USER: syndication_tests
          MARIADB_PASSWORD: syndication_disposable
        ports:
          - 127.0.0.1:3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_ABSPATH: ${{ runner.temp }}/synd-wordpress
      WP_TESTS_DB_NAME: syndication_tests
      WP_TESTS_DB_USER: syndication_tests
      WP_TESTS_DB_PASSWORD: syndication_disposable
      WP_TESTS_DB_HOST: 127.0.0.1:3307
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP 8.4.27 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          extensions: mysqli
          coverage: none
          tools: composer:v2
      - name: Validate integration Composer configuration
        run: composer validate --working-dir=tests/Integration --strict --no-check-publish
      - name: Install locked integration dependencies
        run: composer install --working-dir=tests/Integration --no-interaction --no-progress --prefer-dist
      - name: Download clean matched WordPress 6.8.3 fixture
        run: |
          curl --fail --location --retry 3 https://wordpress.org/wordpress-6.8.3.tar.gz -o "$RUNNER_TEMP/wordpress.tar.gz"
          mkdir -p "$WP_TESTS_ABSPATH"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" --strip-components=1 -C "$WP_TESTS_ABSPATH"
      - name: Run WordPress single-site tests
        run: tests/Integration/vendor/bin/phpunit -c tests/Integration/phpunit.xml
      - name: Run WordPress multisite tests
        env:
          WP_MULTISITE: '1'
        run: tests/Integration/vendor/bin/phpunit -c tests/Integration/phpunit.xml

  ci:
    name: CI
    needs: [synced-files, php, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "::error::No prerequisite results to read"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A prerequisite reported $result"
              exit 1
            fi
          done
