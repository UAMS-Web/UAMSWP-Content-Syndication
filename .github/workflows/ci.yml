name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  synced-files:
    name: Synced files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

  php:
    name: PHP checks (${{ matrix.os }})
    needs: [synced-files]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP 8.4.27 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          coverage: none
          tools: composer:v2
      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish
      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4.27-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Check formatting
        run: composer test:pint
      - name: Check refactoring
        run: composer test:refactor
      - name: Run static analysis
        run: composer stan
      - name: Run unit tests
        run: composer test

  ci:
    name: CI
    needs: [synced-files, php]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "::error::No prerequisite results to read"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A prerequisite reported $result"
              exit 1
            fi
          done
