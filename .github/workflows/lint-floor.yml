name: Lint floor

# Fails when a file the plugin download ships holds syntax that PHP 8.2, the supported
# floor, cannot parse. Development and the unit suite run on PHP 8.4, which accepts
# syntax the floor rejects, so the ordinary tools cannot see this.
#
# Shape: the `lint-floor` job of the tests skill (.claude/skills/tests/SKILL.md, "The floor
# lint job") run as an Actions step, because this public repository has no shared local CI
# runner. It lints the files `git archive` puts in the download (the keep-list in
# `.gitattributes` applied), so what is parsed is what ships, and a new shipped folder is
# covered without editing this file. It prints how many files it parsed and fails on zero,
# so an empty archive cannot read as a clean one.
#
# Gated on RUN_REMOTE_CI like the rest of CI: with the variable set to `false` the job is
# skipped before a runner is dispatched. A skipped job reports `skipped`, which is not a
# passing run.

on:
  pull_request:
  push:
    branches: [main, master]

# Nothing at the workflow level; the one job states the scopes it needs.
permissions: {}

jobs:
  lint-floor:
    if: vars.RUN_REMOTE_CI != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Parse every shipped PHP file on the floor PHP
        shell: bash
        run: |
          set -euo pipefail
          php -v | head -n 1
          dir="$(mktemp -d)"
          git archive --worktree-attributes HEAD | tar -x -C "$dir"
          count=0
          failed=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            php -l "$file" > /dev/null || failed=$((failed + 1))
          done < <(find "$dir" -name '*.php' -print0)
          echo "parsed $count shipped PHP file(s), $failed failed"
          [ "$count" -gt 0 ] || { echo "no PHP file in the archive" >&2; exit 1; }
          [ "$failed" -eq 0 ]
